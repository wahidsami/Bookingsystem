<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Paid Receipt</title></head>
<body style="font-family:Arial,sans-serif;background:#f4fff7;padding:24px;">
  <div style="max-width:680px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;">
    <h2 style="margin:0 0 12px;color:#1f8f5a;">Payment Received</h2>
    <p>Hello {{customerName}},</p>
    <p>We received your payment at <strong>{{tenantName}}</strong>.</p>
    <p><strong>Invoice #:</strong> {{invoiceNumber}}</p>
    <p><strong>Status:</strong> {{invoiceStatus}}</p>
    <p><strong>Paid at:</strong> {{paidAtText}}</p>
    <hr style="border:none;border-top:1px solid #ddf6e8;margin:14px 0;">
    <p><strong>Total:</strong> {{totalAmountText}}</p>
    <p><strong>Paid:</strong> {{paidAmountText}}</p>
    <p><strong>Remaining due:</strong> {{dueAmountText}}</p>
    <p style="margin-top:18px;">Thank you for choosing Refah.</p>
  </div>
</body>
</html>
