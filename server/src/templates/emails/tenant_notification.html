<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Refah Notification</title>
</head>
<body style="margin:0;padding:0;background:#f5f3ff;font-family:Arial,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e9d5ff;">
          <tr>
            <td style="background:#7f50d2;color:#ffffff;padding:20px 24px;">
              <h1 style="margin:0;font-size:22px;line-height:1.3;">{{title}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              <p style="margin:0 0 12px 0;">{{greeting}} {{tenantName}},</p>
              <p style="margin:0 0 12px 0;">{{message}}</p>
              {{#if actionUrl}}
              <p style="margin:0 0 20px 0;">
                <a href="{{actionUrl}}" style="display:inline-block;background:#7f50d2;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700;">{{actionText}}</a>
              </p>
              {{/if}}
              <p style="margin:20px 0 0 0;font-size:14px;color:#6b7280;">{{footerText}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
