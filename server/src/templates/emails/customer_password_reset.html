<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rifah Password Reset</title>
</head>
<body style="margin:0;padding:0;background:#f5f3ff;font-family:Arial,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:16px;padding:28px;">
          <tr>
            <td style="padding-bottom:12px;">
              <h1 style="margin:0;font-size:24px;line-height:1.3;color:#111827;">Reset your password</h1>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:12px;">
              <p style="margin:0;font-size:15px;line-height:1.7;color:#374151;">
                Hi {{firstName}}, we received a request to reset your password.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 0 20px;">
              <a href="{{resetUrl}}" style="display:inline-block;background:#7F50D2;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:10px;">
                Reset Password
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:12px;">
              <p style="margin:0;font-size:14px;line-height:1.7;color:#6b7280;">
                This link expires in {{expiresInMinutes}} minutes.
              </p>
            </td>
          </tr>
          <tr>
            <td>
              <p style="margin:0;font-size:12px;line-height:1.6;color:#9ca3af;">
                If you did not request this, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
