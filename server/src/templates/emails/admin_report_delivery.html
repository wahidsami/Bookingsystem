<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scheduled Report Delivery</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #dbeafe;">
          <tr>
            <td style="background:linear-gradient(135deg,#0f172a 0%,#1d4ed8 100%);color:#ffffff;padding:24px 28px;">
              <h1 style="margin:0;font-size:24px;line-height:1.3;">{{reportTitle}}</h1>
              <p style="margin:8px 0 0 0;font-size:14px;opacity:0.9;">Scheduled report delivery</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <p style="margin:0 0 12px 0;">Your scheduled report is ready.</p>
              <p style="margin:0 0 18px 0;color:#475569;">Generated at {{generatedAt}}</p>
              <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:16px 18px;margin-bottom:18px;">
                <p style="margin:0 0 6px 0;font-weight:700;color:#1d4ed8;">Summary</p>
                <p style="margin:0;color:#1e293b;line-height:1.6;">{{summaryLine}}</p>
                <p style="margin:8px 0 0 0;color:#475569;font-size:13px;">Rows: {{rowCount}} | Records: {{recordCount}}</p>
              </div>
              <p style="margin:0 0 22px 0;">
                <a href="{{dashboardUrl}}" style="display:inline-block;background:#0f172a;color:#ffffff;text-decoration:none;padding:12px 18px;border-radius:10px;font-weight:700;">Open dashboard</a>
              </p>
              <p style="margin:0;color:#64748b;font-size:13px;line-height:1.6;">
                This report was delivered from the Refah scheduling engine with PDF and Excel attachments.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
